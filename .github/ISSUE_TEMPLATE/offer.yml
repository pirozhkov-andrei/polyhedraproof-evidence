name: Offer computing time
description: Offer CPU time for the campaign of the 59 formulas
title: "Offer: <cores> cores, <core-hours> core-hours"
labels: ["offer"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping! How it works: [CONTRIBUTING.md](https://github.com/pirozhkov-andrei/polyhedraproof-evidence/blob/main/CONTRIBUTING.md).
        A unit of work takes roughly 60 to 120 core-hours (known only roughly), and partial work
        counts. One issue is one worker with at most 10 units: you get your units in a reply here
        and attach your results here. To give more, open a new issue once this one is done. For
        more than 3000 core-hours in all, please write to pirozhkov.andrey.u@gmail.com first.
  - type: input
    id: machine
    attributes:
      label: Machine
      description: Cores, memory, free disk, and Linux or Windows
      placeholder: "16 cores, 64 GB, 300 GB free, Linux"
    validations:
      required: true
  - type: input
    id: offer
    attributes:
      label: Core-hours for this issue
      description: Roughly; 10 units are about 600 to 1200 core-hours
      placeholder: "400"
    validations:
      required: true
  - type: input
    id: availability
    attributes:
      label: When
      placeholder: "around the clock for two weeks / nights for a month"
    validations:
      required: true
  - type: input
    id: earlier
    attributes:
      label: Your earlier issues here (optional)
      placeholder: "#12"
    validations:
      required: false
  - type: input
    id: credit
    attributes:
      label: Name for the acknowledgements (optional)
      description: Leave empty if you prefer not to be named
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Please confirm
      options:
        - label: my machine runs Linux on x86-64, or Windows 10/11 with WSL 2, and Docker
          required: true
        - label: my results are public once I attach them here (CC BY 4.0); they contain the worker name, the processor model and the computation, but no names or paths from my computer
          required: true
        - label: some of the cases I compute will be recomputed elsewhere as a check
          required: true
