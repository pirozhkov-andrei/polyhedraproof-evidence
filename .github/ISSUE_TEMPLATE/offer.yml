name: Offer computing time
description: Offer CPU time for the campaign of the 59 formulas
title: "Offer: <cores> cores, <core-hours> core-hours"
labels: ["offer"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Please read [CONTRIBUTING.md](https://github.com/pirozhkov-andrei/polyhedraproof-evidence/blob/main/CONTRIBUTING.md) first.
        How long a unit of work takes is known only roughly: in the pilot computation a unit took
        57 to 117 core-hours, and units of other formulas may differ several-fold. Partial work
        counts. You will receive a worker name and the numbers of your units in a reply here;
        everything else is in this repository. If you prefer not to post publicly, write to
        pirozhkov.andrey.u@gmail.com instead.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux on x86-64, with Docker
        - Windows 10/11 with WSL 2 and Docker Desktop
        - A Linux x86-64 virtual machine with Docker (for example in a cloud)
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine
      description: Physical cores, memory, free disk
      placeholder: "16 cores, 64 GiB, 300 GB free"
    validations:
      required: true
  - type: input
    id: offer
    attributes:
      label: Core-hours offered
      description: Roughly; partial work counts as well
      placeholder: "400"
    validations:
      required: true
  - type: input
    id: availability
    attributes:
      label: Availability
      placeholder: "around the clock for two weeks / nights and weekends for a month"
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit
      description: How you would like to be acknowledged (name, affiliation), or "anonymous"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: I understand that
      options:
        - label: the journal my worker writes will be published with the evidence of the campaign when it ends (CC BY 4.0); it contains the worker name, the processor model and the computation, no host name, user name or paths
          required: true
        - label: a sample of the cases my worker closes will be recomputed on another machine
          required: true
